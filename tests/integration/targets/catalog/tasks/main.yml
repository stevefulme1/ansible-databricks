---
# Integration tests for stevefulme1.databricks.catalog

- name: Create catalog
  stevefulme1.databricks.catalog:
    name: "ansible_test_catalog"
    state: present
    comment: "Ansible test catalog"
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: create_result

- name: Verify creation
  ansible.builtin.assert:
    that:
      - create_result is changed

- name: Create catalog again (idempotency)
  stevefulme1.databricks.catalog:
    name: "ansible_test_catalog"
    state: present
    comment: "Ansible test catalog"
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: idem_result

- name: Verify idempotency
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Update catalog
  stevefulme1.databricks.catalog:
    name: "ansible_test_catalog"
    state: present
    comment: "Updated catalog"
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: update_result

- name: Verify update
  ansible.builtin.assert:
    that:
      - update_result is changed

- name: Delete catalog
  stevefulme1.databricks.catalog:
    name: "ansible_test_catalog"
    state: absent
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: delete_result

- name: Verify deletion
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete catalog again (idempotency)
  stevefulme1.databricks.catalog:
    name: "ansible_test_catalog"
    state: absent
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: delete_idem

- name: Verify delete idempotency
  ansible.builtin.assert:
    that:
      - delete_idem is not changed
