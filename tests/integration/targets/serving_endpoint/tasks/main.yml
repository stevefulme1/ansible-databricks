---
# Integration tests for stevefulme1.databricks.serving_endpoint

- name: Create serving_endpoint
  stevefulme1.databricks.serving_endpoint:
    name: "ansible-test-endpoint"
    state: present
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: create_result

- name: Verify creation
  ansible.builtin.assert:
    that:
      - create_result is changed

- name: Create serving_endpoint again (idempotency)
  stevefulme1.databricks.serving_endpoint:
    name: "ansible-test-endpoint"
    state: present
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: idem_result

- name: Verify idempotency
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Delete serving_endpoint
  stevefulme1.databricks.serving_endpoint:
    name: "ansible-test-endpoint"
    state: absent
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: delete_result

- name: Verify deletion
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete serving_endpoint again (idempotency)
  stevefulme1.databricks.serving_endpoint:
    name: "ansible-test-endpoint"
    state: absent
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: delete_idem

- name: Verify delete idempotency
  ansible.builtin.assert:
    that:
      - delete_idem is not changed
