---
# Integration tests for stevefulme1.databricks.instance_pool

- name: Create instance_pool
  stevefulme1.databricks.instance_pool:
    name: "ansible-test-pool"
    min_idle_instances: 0
    max_capacity: 2
    node_type_id: "i3.xlarge"
    state: present
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: create_result

- name: Verify creation
  ansible.builtin.assert:
    that:
      - create_result is changed

- name: Create instance_pool again (idempotency)
  stevefulme1.databricks.instance_pool:
    name: "ansible-test-pool"
    min_idle_instances: 0
    max_capacity: 2
    node_type_id: "i3.xlarge"
    state: present
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: idem_result

- name: Verify idempotency
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Update instance_pool
  stevefulme1.databricks.instance_pool:
    name: "ansible-test-pool"
    min_idle_instances: 1
    max_capacity: 4
    node_type_id: "i3.xlarge"
    state: present
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: update_result

- name: Verify update
  ansible.builtin.assert:
    that:
      - update_result is changed

- name: Delete instance_pool
  stevefulme1.databricks.instance_pool:
    name: "ansible-test-pool"
    state: absent
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: delete_result

- name: Verify deletion
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete instance_pool again (idempotency)
  stevefulme1.databricks.instance_pool:
    name: "ansible-test-pool"
    state: absent
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: delete_idem

- name: Verify delete idempotency
  ansible.builtin.assert:
    that:
      - delete_idem is not changed
