---
# Integration tests for stevefulme1.databricks.schema

- name: Create schema
  stevefulme1.databricks.schema:
    name: "ansible_test_schema"
    catalog_name: "main"
    state: present
    comment: "Test schema"
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: create_result

- name: Verify creation
  ansible.builtin.assert:
    that:
      - create_result is changed

- name: Create schema again (idempotency)
  stevefulme1.databricks.schema:
    name: "ansible_test_schema"
    catalog_name: "main"
    state: present
    comment: "Test schema"
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: idem_result

- name: Verify idempotency
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Update schema
  stevefulme1.databricks.schema:
    name: "ansible_test_schema"
    catalog_name: "main"
    state: present
    comment: "Updated schema"
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: update_result

- name: Verify update
  ansible.builtin.assert:
    that:
      - update_result is changed

- name: Delete schema
  stevefulme1.databricks.schema:
    name: "ansible_test_schema"
    catalog_name: "main"
    state: absent
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: delete_result

- name: Verify deletion
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete schema again (idempotency)
  stevefulme1.databricks.schema:
    name: "ansible_test_schema"
    catalog_name: "main"
    state: absent
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: delete_idem

- name: Verify delete idempotency
  ansible.builtin.assert:
    that:
      - delete_idem is not changed
