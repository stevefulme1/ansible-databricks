---
# Integration tests for stevefulme1.databricks.volume

- name: Create volume
  stevefulme1.databricks.volume:
    name: "ansible_test_vol"
    catalog_name: "main"
    schema_name: "default"
    volume_type: MANAGED
    state: present
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: create_result

- name: Verify creation
  ansible.builtin.assert:
    that:
      - create_result is changed

- name: Create volume again (idempotency)
  stevefulme1.databricks.volume:
    name: "ansible_test_vol"
    catalog_name: "main"
    schema_name: "default"
    volume_type: MANAGED
    state: present
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: idem_result

- name: Verify idempotency
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Update volume
  stevefulme1.databricks.volume:
    name: "ansible_test_vol"
    catalog_name: "main"
    schema_name: "default"
    volume_type: MANAGED
    comment: "Updated"
    state: present
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: update_result

- name: Verify update
  ansible.builtin.assert:
    that:
      - update_result is changed

- name: Delete volume
  stevefulme1.databricks.volume:
    name: "ansible_test_vol"
    catalog_name: "main"
    schema_name: "default"
    state: absent
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: delete_result

- name: Verify deletion
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete volume again (idempotency)
  stevefulme1.databricks.volume:
    name: "ansible_test_vol"
    catalog_name: "main"
    schema_name: "default"
    state: absent
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: delete_idem

- name: Verify delete idempotency
  ansible.builtin.assert:
    that:
      - delete_idem is not changed
