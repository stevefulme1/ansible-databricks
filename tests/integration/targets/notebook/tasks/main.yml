---
# Integration tests for stevefulme1.databricks.notebook

- name: Create notebook
  stevefulme1.databricks.notebook:
    path: "/Users/test/ansible-test-notebook"
    language: PYTHON
    content: "IyBUZXN0"
    state: present
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: create_result

- name: Verify creation
  ansible.builtin.assert:
    that:
      - create_result is changed

- name: Create notebook again (idempotency)
  stevefulme1.databricks.notebook:
    path: "/Users/test/ansible-test-notebook"
    language: PYTHON
    content: "IyBUZXN0"
    state: present
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: idem_result

- name: Verify idempotency
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Delete notebook
  stevefulme1.databricks.notebook:
    path: "/Users/test/ansible-test-notebook"
    state: absent
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: delete_result

- name: Verify deletion
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete notebook again (idempotency)
  stevefulme1.databricks.notebook:
    path: "/Users/test/ansible-test-notebook"
    state: absent
    host: "{{ databricks_host }}"
    token: "{{ databricks_token }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: delete_idem

- name: Verify delete idempotency
  ansible.builtin.assert:
    that:
      - delete_idem is not changed
